name: Aether Toolbox (WPF)

# Compila Aether Toolbox, antes "Centro Aether" (WPF, .NET 8, self-contained, un solo .exe) como
# validacion de compilacion. No es el ejecutable final de distribucion: el
# instalador completo lo arma aether-app.yml (manual).
on:
  workflow_dispatch:
  push:
    paths:
      - 'centro/**'
      - '.github/workflows/centro.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Publish (WPF, self-contained, un solo .exe)
        working-directory: centro
        run: >
          dotnet publish CentroAether.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload Aether Toolbox
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Aether-Toolbox-${{ github.sha }}
          path: centro/publish
          if-no-files-found: error
