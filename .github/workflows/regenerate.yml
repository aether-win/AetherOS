name: Regenerar archivos generados

# Aether: corre a mano (Actions > Regenerar archivos generados > Run workflow).
# Regenera el catálogo de toggles/tweaks y los lanzadores de AtlasDesktop con las
# herramientas de PowerShell y deja el resultado en la rama "regenerado" para revisarlo
# y traerlo a main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Regenerate launchers and catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\dev\New-ToggleLaunchers.ps1
          if ($LASTEXITCODE -ne 0) { throw "New-ToggleLaunchers failed with $LASTEXITCODE" }
          & .\tools\dev\Export-AtlasCatalog.ps1
          if ($LASTEXITCODE -ne 0) { throw "Export-AtlasCatalog failed with $LASTEXITCODE" }

      - name: Push to the regenerado branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Regenerar catálogo y lanzadores' --allow-empty
          git push --force origin HEAD:refs/heads/regenerado
