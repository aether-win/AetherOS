name: Aether Transfer (WinUI 3)

# Compila el cliente FTP/FTPS/SFTP Aether Transfer (WinUI 3, unpackaged, self-contained)
# como validación de compilación. No genera el ejecutable final de distribución.
on:
  workflow_dispatch:
  push:
    paths:
      - 'aether-transfer/**'
      - '.github/workflows/aether-transfer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Restore
        working-directory: aether-transfer
        run: msbuild AetherTransfer.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Build (unpackaged, self-contained)
        working-directory: aether-transfer
        run: >
          msbuild AetherTransfer.csproj /t:Build
          /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true
