name: Compilar Aether (instalador)

# Aether: corre a mano (Actions > Compilar Aether (instalador) > Run workflow).
# Arma el paquete de Aether OS y lo mete dentro de la app (embedded-playbook), así el
# instalador funciona sin conectarse a GitHub ni a los servidores de Atlas. Deja
# "AETHER OS 2.0.exe" como artefacto descargable desde la página de la ejecución.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aether:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET 8 (para el Centro)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Compilar Aether Toolbox (WPF) y meterlo en el paquete
        shell: pwsh
        working-directory: centro
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish CentroAether.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish del Centro falló ($LASTEXITCODE)" }
          $destino = '..\playbook\Executables\AtlasModules\Aether\Centro\app'
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
          Copy-Item -Path 'publish\*' -Destination $destino -Recurse -Force
          if (-not (Test-Path (Join-Path $destino 'AetherToolbox.exe'))) { throw 'No se copió AetherToolbox.exe al paquete.' }
          Write-Host "Aether Toolbox incluido en el paquete ($(@(Get-ChildItem $destino -Recurse -File).Count) archivos)."

      - name: Compilar Aether Transfer (FTP) y meterlo en el paquete
        shell: pwsh
        working-directory: aether-transfer
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish AetherTransfer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish de Aether Transfer falló ($LASTEXITCODE)" }
          $destino = '..\playbook\Executables\AtlasModules\Aether\Transfer'
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
          Copy-Item -Path 'publish\*' -Destination $destino -Recurse -Force
          if (-not (Test-Path (Join-Path $destino 'AetherTransfer.exe'))) { throw 'No se copió AetherTransfer.exe al paquete.' }
          Write-Host "Aether Transfer incluido en el paquete."

      - name: Armar el paquete de Aether OS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\build\Build-Playbook.ps1 -ReplaceOldPlaybook -FileName 'Aether OS' -DontOpenPbLocation
          $apbx = Get-Item -LiteralPath 'playbook\Aether OS.apbx' -ErrorAction Stop
          & .\tools\build\Test-Apbx.ps1 -Path $apbx.FullName
          # Aether: el paquete debe llevar Aether Toolbox y Aether Transfer (no solo la versión clásica).
          $lista = & 7z l -slt -p'malte' $apbx.FullName 2>&1 | Out-String
          foreach ($exe in 'AetherToolbox.exe', 'AetherTransfer.exe') {
            if ($lista -notmatch [regex]::Escape($exe)) { throw "El paquete no contiene $exe." }
          }
          Write-Host 'Paquete verificado: AetherToolbox.exe y AetherTransfer.exe incluidos.'
          $version = ([xml](Get-Content -LiteralPath 'playbook\playbook.conf' -Raw)).Playbook.Version
          "ATLAS_EMBED_APBX=$($apbx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ATLAS_RC_ID=$version-rc.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app

      - name: Compilar la app con el paquete adentro
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # El runtime de C va dentro del .exe (sin esto pide VCRUNTIME140.dll).
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked --target x86_64-pc-windows-msvc --features embedded-playbook
          if ($LASTEXITCODE -ne 0) { throw "cargo build falló con $LASTEXITCODE" }
          $out = Join-Path $env:RUNNER_TEMP 'aether'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath 'target\x86_64-pc-windows-msvc\release\AtlasManager.exe' -Destination (Join-Path $out 'AETHER OS 2.0.exe')
          Copy-Item -LiteralPath $env:ATLAS_EMBED_APBX -Destination $out
          Copy-Item -LiteralPath '..\LICENSE' -Destination (Join-Path $out 'LICENSE.txt')
          "AETHER_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Guardar AETHER OS 2.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AETHER-OS-2.0
          path: ${{ env.AETHER_OUT }}
          if-no-files-found: error
          retention-days: 14
