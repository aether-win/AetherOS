---
title: Root Playbook File
description: Captures AME install facts, then runs the Atlas installer
actions:
  - !writeStatus: { status: 'Preparing AtlasOS installation' }

  # AME owns only mode and OOBE applicability. The generic upgrade selectors and
  # target-version reapply selectors intentionally retain the existing AME gates.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Fresh'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: false
    oobe: false
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Upgrade'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    oobe: false
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Reapply'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    onUpgradeVersions: ['2.0.0']
    oobe: false
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Fresh -Oobe'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: false
    oobe: only
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Upgrade -Oobe'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    oobe: only
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Reapply -Oobe'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    onUpgradeVersions: ['2.0.0']
    oobe: only
    handleExitCodes: { "!0": halt }

  # The interactive user publishes only its identity marker. TrustedInstaller validates
  # and commits that marker with the captured mode and selected options below.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Publish-AtlasInstallUser.ps1"'
    runas: currentUser
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    oobe: false
    handleExitCodes: { "!0": halt }

  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option app-chatgpt', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'app-chatgpt', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option app-claude', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'app-claude', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option app-keyvault', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'app-keyvault', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option app-pcmanager', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'app-pcmanager', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option app-python', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'app-python', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option app-steam', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'app-steam', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option auto-updates-default', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'auto-updates-default', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option auto-updates-disable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'auto-updates-disable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option defender-disable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'defender-disable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option defender-enable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'defender-enable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option disable-core-isolation', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'disable-core-isolation', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option keyboard-selector', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'keyboard-selector', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option keyboard-shortcuts', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'keyboard-shortcuts', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option keyboard-single', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'keyboard-single', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option mitigations-default', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'mitigations-default', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option mitigations-disable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'mitigations-disable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option theme-dark', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'theme-dark', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option theme-light', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'theme-light', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option wind-aether', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'wind-aether', handleExitCodes: { "!0": halt } }

  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Initialize-AtlasInstallState.ps1" -Operation Commit'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    handleExitCodes: { "!0": halt }

  - !writeStatus: { status: 'Installing AtlasOS' }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Entry\Invoke-AtlasInstall.ps1" -Run'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    handleExitCodes: { "!0": halt }
