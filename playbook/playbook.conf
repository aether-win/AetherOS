<Playbook>
	<Name>AetherOS</Name>
	<Username>Aether</Username>
	<Title>Aether OS v2.0.0</Title>
	<ShortDescription>Aether OS para Windows 11</ShortDescription>
	<Description><![CDATA[Aether OS ajusta Windows 11 para trabajar y jugar: privacidad, rendimiento, red lista para compartir archivos y una interfaz más cuidada. Basado en Atlas (GPLv3).]]></Description>
	<Details>Una modificación abierta y ligera de Windows 11, pensada para trabajar y jugar.</Details>
	<ProgressText><![CDATA[Aether está instalando programas, copiando su configuración y ajustando Windows. No apagues la PC.]]></ProgressText>
	<!-- La versión se cambia con tools/build/Set-AtlasVersion.ps1 (pendiente: pasada de AME y versión). -->
	<Version>2.0.0</Version>
	<SupportedBuilds>
		<!-- 25H2 -->
		<string>26200</string>
		<!-- 26H2 -->
		<string>26300</string>
	</SupportedBuilds>
	<!-- Pendiente: Aether no se actualiza desde Atlas; se quita junto con el código de compatibilidad. -->
	<UpgradableFrom>
        <string>0.4.1</string>
        <string>0.5.0</string>
        <string>0.6.0</string>
    </UpgradableFrom>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>Internet</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
	<UniqueId>7ab49a09-c8a6-4d95-86aa-6a516392084e</UniqueId>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
	<ProductCode>64</ProductCode>
	<EstimatedMinutes>20</EstimatedMinutes>
	<SupportsISO>true</SupportsISO>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Rocket" Title="Rendimiento"
			Description="Dos modos: Trabajo para el día a día y Gaming para sacar el máximo cuando juegas."/>
			<BulletPoint Icon="Lock" Title="Red lista"
			Description="Compartir archivos e impresoras en red funciona desde el primer arranque."/>
			<BulletPoint Icon="Privacy" Title="Privacidad"
			Description="Menos telemetría, sin publicidad de Windows y sin apps que no usas."/>
		</BulletPoints>
		<Internet>Force</Internet>
	</OOBE>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<FeaturePages>
		<RadioPage IsRequired="true" DefaultOption="defender-enable" Description="Windows Defender y SmartScreen protegen contra virus y páginas falsas.">
			<TopLine Text="Si prestas la PC, déjalo activado."/>
			<Options>
				<RadioOption>
					<Text>Mantener Windows Defender y SmartScreen (recomendado)</Text>
					<Name>defender-enable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Eliminar Windows Defender y SmartScreen (instalaré otro antivirus)</Text>
					<Name>defender-disable</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Puedes volver a elegir después desde la app de Aether."/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="mitigations-default" Description="Las mitigaciones protegen contra fallas de seguridad del procesador.">
			<TopLine Text="En procesadores modernos, desactivarlas no da más rendimiento."/>
			<Options>
				<RadioOption>
					<Text>Mitigaciones de Windows por defecto (recomendado)</Text>
					<Name>mitigations-default</Name>
				</RadioOption>
				<RadioOption>
					<Text>Desactivar todas las mitigaciones</Text>
					<Name>mitigations-disable</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="auto-updates-disable" Description="Aether puede pausar Windows Update hasta el año 3000. Actualizas cuando tú quieras con un botón.">
			<TopLine Text="Las actualizaciones de Edge, Office y tus apps siguen llegando aparte."/>
			<Options>
				<RadioOption>
					<Text>Pausar las actualizaciones de Windows (recomendado)</Text>
					<Name>auto-updates-disable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Dejar las actualizaciones automáticas de Windows</Text>
					<Name>auto-updates-default</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="theme-dark" Description="Elige el tema de Windows. Lo puedes cambiar cuando quieras desde la app de Aether.">
			<Options>
				<RadioOption>
					<Text>Oscuro</Text>
					<Name>theme-dark</Name>
				</RadioOption>
				<RadioOption>
					<Text>Claro</Text>
					<Name>theme-light</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="keyboard-single" Description="¿Cómo cambias el idioma del teclado?">
			<Options>
				<RadioOption>
					<Text>No lo cambio, uso un solo teclado</Text>
					<Name>keyboard-single</Name>
				</RadioOption>
				<RadioOption>
					<Text>Con atajos de teclado</Text>
					<Name>keyboard-shortcuts</Name>
				</RadioOption>
				<RadioOption>
					<Text>Con el selector de la barra de tareas</Text>
					<Name>keyboard-selector</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Rendimiento. Todo se puede cambiar después desde la app de Aether.">
			<Options>
				<CheckboxOption>
					<Text>Desactivar la seguridad basada en virtualización (VBS) para más rendimiento en juegos</Text>
					<Name>disable-core-isolation</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Aplicaciones de inteligencia artificial y trabajo. Se instalan en su última versión.">
			<Options>
				<CheckboxOption>
					<Text>Claude</Text>
					<Name>app-claude</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>ChatGPT</Text>
					<Name>app-chatgpt</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Python 3.13.16</Text>
					<Name>app-python</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>KeyVault</Text>
					<Name>app-keyvault</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Utilidades y juegos.">
			<Options>
				<CheckboxOption>
					<Text>Microsoft PC Manager</Text>
					<Name>app-pcmanager</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Steam</Text>
					<Name>app-steam</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Interfaz.">
			<Options>
				<CheckboxOption>
					<Text>Wind-Aether: mejoras visuales de Windows (los mods quedan desactivados para que tú elijas)</Text>
					<Name>wind-aether</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
</Playbook>
